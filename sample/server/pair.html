<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in with your phone</title>
<style>
  :root {
    --page: #f4f4f5; --card: #fff; --text: #18181b; --muted: #52525b; --line: #e4e4e7;
    --accent: #2f5bd3; --accent-tint: #eef2fc; --ok: #15803d; --ok-tint: #ecfdf3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text); background: var(--page);
  }
  main { width: 100%; max-width: 400px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 32px 28px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; font-weight: 600; font-size: 15px; }
  .mark { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 15px; font-weight: 700; }
  h1 { font-size: 26px; line-height: 1.25; font-weight: 650; margin: 0 0 8px; letter-spacing: -0.01em; }
  p { margin: 0 0 20px; color: var(--muted); }
  #code {
    font: 650 52px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: 0.06em; font-variant-numeric: tabular-nums;
    text-align: center; padding: 26px 0; margin: 4px 0 20px; color: var(--accent); background: var(--accent-tint); border-radius: 12px;
  }
  #status { display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--muted); }
  #status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #a1a1aa; }
  .check { width: 64px; height: 64px; border-radius: 50%; background: var(--ok); display: grid; place-items: center; margin-bottom: 20px; }
  .signed-in h1 { color: var(--ok); font-size: 30px; }
  .who { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 12px; background: var(--ok-tint); margin: 4px 0 20px; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; font-weight: 650; font-size: 15px; }
  #who { margin: 0; color: var(--text); font-weight: 550; }
  button { font: inherit; font-weight: 550; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--line); background: #fff; color: var(--text); cursor: pointer; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="brand"><span class="mark" aria-hidden="true">A</span>Acme Notes</div>
  <section id="waiting">
    <h1>Sign in with your phone</h1>
    <p>Open the duet pair app on your phone and enter this code.</p>
    <div id="code" aria-label="Sign-in code">&nbsp;</div>
    <div id="status">Getting a code</div>
  </section>
  <section id="done" class="signed-in" hidden>
    <div class="check" aria-hidden="true">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    </div>
    <h1>Signed in</h1>
    <div class="who">
      <span class="avatar" aria-hidden="true">PO</span>
      <p id="who"></p>
    </div>
    <button id="out">Sign out</button>
  </section>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  let id, timer;

  async function start() {
    clearInterval(timer);
    $('waiting').hidden = false;
    $('done').hidden = true;
    const r = await fetch('/api/pair', { method: 'POST' }).then((x) => x.json());
    id = r.id;
    $('code').dataset.code = r.code;
    $('code').textContent = `${r.code.slice(0, 3)} ${r.code.slice(3)}`;
    $('status').textContent = 'Waiting for your phone';
    timer = setInterval(poll, 500);
  }

  async function poll() {
    const r = await fetch(`/api/pair/${id}`).then((x) => x.json()).catch(() => null);
    if (!r) return;
    if (r.status === 'approved') {
      clearInterval(timer);
      $('waiting').hidden = true;
      $('done').hidden = false;
      $('who').textContent = `Signed in as ${r.name}.`;
    } else if (r.status === 'expired') {
      clearInterval(timer);
      $('status').textContent = 'This code expired. Reload for a new one.';
    }
  }

  $('out').onclick = start;
  start();
</script>
</body>
</html>
