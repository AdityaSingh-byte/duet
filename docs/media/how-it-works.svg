<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d">
  <title id="t">How duet works</title>
  <desc id="d">An AI agent calls duet through MCP or the CLI. duet drives a real Android phone over adb and visible Chrome windows through Puppeteer, checks a safety guard before each phone action, and writes every step to a run folder with screenshots, device logs, an HTML report and a video.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #ffffff; stroke: #cfcfcf; stroke-width: 1.5; }
    .core { fill: #f4f4f4; stroke: #1d1d1f; stroke-width: 1.5; }
    .h { font: 600 17px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1d1d1f; }
    .t { font: 400 13.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #5f6368; }
    .m { font: 500 12.5px ui-monospace, "SF Mono", Menlo, monospace; fill: #5f6368; }
    .line { stroke: #8a8a8a; stroke-width: 1.5; fill: none; }
    .head { fill: #8a8a8a; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #0d1117; stroke: #3d444d; }
      .core { fill: #161b22; stroke: #e6edf3; }
      .h { fill: #e6edf3; }
      .t, .m { fill: #9198a1; }
      .line { stroke: #6e7681; }
      .head { fill: #6e7681; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="400" rx="12"/>

  <!-- agent -->
  <rect class="box" x="24" y="150" width="170" height="100" rx="8"/>
  <text class="h" x="40" y="186">AI agent</text>
  <text class="t" x="40" y="210">Claude Code, or any</text>
  <text class="t" x="40" y="228">tool that runs a CLI</text>

  <path class="line" d="M194 200 H282" marker-end="url(#a)"/>
  <text class="m" x="206" y="190">MCP / CLI</text>

  <!-- duet -->
  <rect class="core" x="286" y="110" width="220" height="180" rx="8"/>
  <text class="h" x="304" y="146">duet</text>
  <text class="t" x="304" y="172">one step per command</text>
  <text class="t" x="304" y="194">scenarios across actors</text>
  <text class="t" x="304" y="216">a guard before every</text>
  <text class="t" x="304" y="234">phone action</text>
  <text class="t" x="304" y="256">values passed between actors</text>

  <!-- phone -->
  <path class="line" d="M506 160 C560 160 560 82 610 82" marker-end="url(#a)"/>
  <rect class="box" x="614" y="30" width="322" height="104" rx="8"/>
  <text class="h" x="632" y="62">Android phone</text>
  <text class="m" x="632" y="86">adb</text>
  <text class="t" x="670" y="86">tap, type, deep links, rotation,</text>
  <text class="t" x="632" y="106">screenshots, logcat, screenrecord</text>

  <!-- browsers -->
  <path class="line" d="M506 200 H610" marker-end="url(#a)"/>
  <rect class="box" x="614" y="148" width="322" height="104" rx="8"/>
  <text class="h" x="632" y="180">Chrome windows</text>
  <text class="m" x="632" y="204">puppeteer</text>
  <text class="t" x="712" y="204">host, guest, ... each its</text>
  <text class="t" x="632" y="224">own profile; fake camera; tab sharing</text>

  <!-- run folder -->
  <path class="line" d="M506 240 C560 240 560 318 610 318" marker-end="url(#a)"/>
  <rect class="box" x="614" y="266" width="322" height="104" rx="8"/>
  <text class="h" x="632" y="298">Run folder</text>
  <text class="t" x="632" y="322">every step with its screenshot and log,</text>
  <text class="t" x="632" y="342">report.html, and a side-by-side video</text>
</svg>
